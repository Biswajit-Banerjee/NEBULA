name: frontend
type: "nodejs:22"

source:
  root: "frontend"

hooks:
  build: |
    set -e
    npx vite build --outDir dist --base=/

web:
  commands:
    start: "sleep infinity"
  locations:
    "/":
      root: "dist"
      index:
        - "index.html"
      scripts: false
      allow: true
      passthru: "/index.html"

disk: 512
